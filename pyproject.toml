[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-perception-loop"
version = "0.1.0"
description = "Reproducible autonomous-driving 2D perception, auto-labeling, and temporal pseudo-label quality research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "AutoPerception-Loop Contributors"}]
dependencies = ["numpy>=1.24,<3", "PyYAML>=6.0", "Pillow>=9.0"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
autoperception = "auto_perception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
